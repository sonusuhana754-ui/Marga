services:
  db:
    image: postgres:15-alpine
    container_name: marga_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marga
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marga_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marga
      - POSTGRES_PORT=5432
      - ENVIRONMENT=development
      - DEBUG=True
    env_file:
      # Optional: a fresh clone has no backend/.env yet (cp .env.example .env).
      # Without TOMTOM_API_KEY the API still runs — traffic: null, as documented.
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Relative by default: nginx proxies /api/ to the backend service.
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    container_name: marga_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
